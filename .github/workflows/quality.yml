name: Quality
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
jobs:
  ruff:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-quality')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruff
        uses: astral-sh/ruff-action@v3
  mypy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-quality')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Type check with mypy
        run: uv run mypy src/py_maya_scene
  pytest-37:
    needs: [ruff, mypy]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-quality')
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - name: Set up Python 3.7
      uses: actions/setup-python@v7
      with:
        python-version: '3.7'
    - name: Install dependencies
      run: pip install "pytest>=7.0,<8.0" "importlib_metadata"
    - name: Test with pytest
      run: PYTHONPATH=src pytest -v --no-header -ra --tb=short --import-mode=importlib -o "addopts="
  pytest:
    needs: [ruff, mypy]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-quality')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Test with pytest
      run: uv run pytest -v --no-header --override-ini="addopts=-ra -n auto" --tb=short --import-mode=importlib
